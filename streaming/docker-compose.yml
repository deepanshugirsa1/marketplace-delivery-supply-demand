# Real brokers, real Flink cluster, real ClickHouse. No simulators.
services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: mk-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "6"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  jobmanager:
    build: ./flink
    container_name: mk-jobmanager
    ports: ["8081:8081"]
    command: jobmanager
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 4

  taskmanager:
    build: ./flink
    container_name: mk-taskmanager
    command: taskmanager
    depends_on: [jobmanager]
    scale: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: mk-clickhouse
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    depends_on:
      kafka: {condition: service_healthy}
